[project]
name = "placidway-agent"
version = "0.1.0"
description = "Source-grounded PlacidWay assessment chatbot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1", "langchain>=1,<2", "langchain-core>=1,<2", "langchain-openai>=1,<2",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "sentence-transformers>=3,<6", "torch>=2.2,<3", "rank-bm25>=0.2.2,<1", "tiktoken>=0.9,<1",
  "typer>=0.15,<1", "python-dotenv>=1,<2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
eval = ["deepeval>=4.3,<5", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
placidway = "placidway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placidway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and a migrated database", "live: calls configured providers", "eval: paid/provider-backed evaluation"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
